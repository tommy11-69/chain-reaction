<div id="screen-game" class="screen hidden">
  <div class="game-layout">

    <!-- Minimal In-Game Top Bar -->
    <header class="game-topbar">
      <div class="topbar-left">
        <span class="topbar-brand">CHAIN REACTION</span>
        <div class="topbar-room" id="game-room-badge" title="Room Code-a Copy Pannu">
          <span class="topbar-label">ROOM-U</span>
          <span id="game-room-code-display" class="topbar-code">——</span>
        </div>
        <span id="network-badge" class="network-badge live" title="Network status">
          <span class="net-dot"></span> LIVE
        </span>
      </div>

      <div id="turn-indicator" class="turn-indicator">
        <span class="turn-pulse-beacon"></span>
        <span class="turn-dot"></span>
        <span class="turn-text">—</span>
      </div>

      <div class="topbar-right">
        <button id="ingame-slang-btn" class="hud-pill-btn" title="Gaali Mode On/Off" aria-label="Toggle Slang Mode">
          <span class="hud-pill-dot active" id="ingame-slang-dot"></span>
          <span id="ingame-slang-text">GAALI: ON</span>
        </button>
        <button id="ingame-freq-btn" class="hud-pill-btn" title="Roast Frequency" aria-label="Slang Frequency">
          <span id="ingame-freq-text">ROAST: MED</span>
        </button>
        <button id="ingame-sound-btn" class="hud-pill-btn" title="Satham On/Off" aria-label="Toggle audio">
          <span class="hud-pill-dot" id="ingame-sound-dot"></span>
          <span id="ingame-sound-text">SATHAM</span>
        </button>
        <a href="tutorial.html" target="_blank" id="ingame-help-btn" class="hud-pill-btn" title="Aata Vidhi (Rules)" aria-label="Game Rules" style="text-decoration:none;">
          <span class="hud-pill-dot active" style="background:var(--accent-cyan);box-shadow:0 0 5px var(--accent-cyan)"></span>
          <span>VAZHI 📖</span>
        </a>
        <button id="ingame-exit-btn" class="hud-pill-btn exit-pill-btn" title="Aatathai vittu veliya po" aria-label="Exit Game">
          <span class="hud-pill-dot" style="background:#ff4d4d;box-shadow:0 0 5px #ff4d4d"></span>
          <span>EXIT ✕</span>
        </button>
      </div>
    </header>

    <!-- Main Game Arena -->
    <div class="game-body">

      <!-- Left HUD: Player Roster & Orb Tally -->
      <aside class="game-sidebar" aria-label="Players">
        <div class="sidebar-header">
          <span class="sidebar-label">AATAKARANGA</span>
        </div>
        <div id="game-players-list" class="game-players-list"></div>
      </aside>

      <!-- Center: Minimal Physical Board Surface -->
      <main class="board-wrapper">
        <div class="board-frame" id="board-frame">
          <div id="game-board" class="game-board" role="grid" aria-label="Chain Reaction board"></div>
          <!-- Canvas Overlay for Luminous Energy Waves & Trails -->
          <canvas id="fx-canvas" class="fx-canvas" aria-hidden="true"></canvas>
        </div>
      </main>

      <!-- Floating Live Player Chat Bubbles -->
      <div id="arena-chat-bubbles" class="arena-chat-bubbles-container" aria-live="polite"></div>

      <!-- Dedicated Bottom Clearance Bar & FAB -->
      <div class="arena-bottom-tray">
        <button id="btn-arena-roast-fab" class="arena-roast-fab" title="Roast / Quick Chat Podu!" aria-label="Open Quick Chat and Roasts">
          <span class="fab-pulse-ring"></span>
          <span class="fab-icon">💬</span>
          <span class="fab-label">ROAST</span>
        </button>
      </div>

    </div>

    <!-- Floating Commentary / Gaali Roast Banner -->
    <div id="commentary-banner" class="commentary-banner hidden" role="status" aria-live="polite">
      <div class="commentary-header">
        <span class="commentary-badge">💀 GAALI VIBE</span>
        <span class="commentary-category" id="commentary-category">REACTION</span>
      </div>
      <p class="commentary-text" id="commentary-text"></p>
    </div>

    <!-- Quick Chat & Roast Drawer (Bottom Popover) -->
    <div id="arena-chat-tray" class="arena-chat-tray hidden" role="dialog" aria-modal="true" aria-label="Quick Roast Chat">
      <div class="tray-backdrop" id="chat-tray-backdrop"></div>
      <div class="tray-sheet">
        <div class="tray-header">
          <div class="tray-title-group">
            <span class="tray-badge">🔥 PLAYER ROAST &amp; TAUNT</span>
            <span class="tray-sub">Blast and tease other players!</span>
          </div>
          <button id="btn-close-chat-tray" class="tray-close-btn" aria-label="Close Chat Tray">✕</button>
        </div>

        <!-- Single-Tap Emoji Blast Bar -->
        <div class="tray-emoji-row">
          <button class="chat-emoji-btn" data-emoji="🔥" title="Fire">🔥</button>
          <button class="chat-emoji-btn" data-emoji="💀" title="Gaali">💀</button>
          <button class="chat-emoji-btn" data-emoji="🤡" title="Joker">🤡</button>
          <button class="chat-emoji-btn" data-emoji="💥" title="Blast">💥</button>
          <button class="chat-emoji-btn" data-emoji="💩" title="Mokka">💩</button>
          <button class="chat-emoji-btn" data-emoji="👑" title="King">👑</button>
          <button class="chat-emoji-btn" data-emoji="😭" title="Katharal">😭</button>
          <button class="chat-emoji-btn" data-emoji="🍿" title="Popcorn">🍿</button>
        </div>

        <!-- Quick Tanglish Roast Pills -->
        <div class="tray-roast-list">
          <button class="chat-roast-pill" data-text="Dei baadu, enna move da idhu?!">Dei baadu, enna move da idhu?! 😂</button>
          <button class="chat-roast-pill" data-text="Avasara koodhi, kavanama podu!">Avasara koodhi, kavanama podu! ⚠️</button>
          <button class="chat-roast-pill" data-text="Kevalamaana move da saami!">Kevalamaana move da saami! 🤡</button>
          <button class="chat-roast-pill" data-text="Enna thala, bayandhutiya?!">Enna thala, bayandhutiya?! 🐔</button>
          <button class="chat-roast-pill" data-text="Wipeout loading... Ready-a iru!">Wipeout loading... Ready-a iru! 💀</button>
          <button class="chat-roast-pill" data-text="Motha board-um ennodadhu da!">Motha board-um ennodadhu da! 🔥</button>
          <button class="chat-roast-pill" data-text="Bomb blast sambavam varudhu!">Bomb blast sambavam varudhu! 💥</button>
          <button class="chat-roast-pill" data-text="Corner dhaan raja! Kitta varadha!">Corner dhaan raja! Kitta varadha! 👑</button>
        </div>

        <!-- Custom Message Input -->
        <div class="tray-input-row">
          <input type="text" id="arena-chat-input" class="tray-chat-input" maxlength="45"
                 placeholder="Un custom roasta type pannu da..." autocomplete="off" spellcheck="false" />
          <button id="btn-arena-chat-send" class="btn btn-primary btn-sm tray-send-btn">Send 🚀</button>
        </div>
      </div>
    </div>

  </div>
</div>
