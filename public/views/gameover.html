<div id="screen-gameover" class="screen hidden">
  <div class="screen-inner">
    <div class="panel gameover-panel">
      <!-- Winner Podium Announcement -->
      <div id="winner-announcement" class="winner-announcement"></div>
      
      <!-- Rematch Votes Counter -->
      <p id="rematch-info" class="rematch-info"></p>
      
      <!-- Action Buttons -->
      <div class="btn-stack">
        <button id="rematch-btn" class="btn btn-primary">
          <span class="btn-indicator"></span>
          Innoru Match Podalaama? (Rematch)
        </button>
        <button id="leave-btn" class="btn btn-secondary">
          Veetukku Kelambu (Exit)
        </button>
      </div>
    </div>
  </div>
</div>
